        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body>

    <div class="janela">
        <div class="header-left">
            <h1 class="titulo">Bazart</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav">

                <h3>Arte do dia</h3>

            </div>
            
            <div class="btn-nav-white">
                <a href="./musicas.html">
                    <h3>Músicas e tradições</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./mural.html">
                    <h3>Meus favoritos</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        
        
        </div>
        <div class="arte">
            <h1>🎨 Arte Persa do Dia</h1>
            <div class="art-box" id="artBox">
                <h2 class="titulo" id="title">Carregando...</h2>
                <img id="image" src="" alt="Imagem da arte" />
                <p id="description"></p>
                <button id="like">❤️</button>
            </div>
        </div>
    </div>


</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    fetch('/arte/mostrar')
      .then(response => response.json())
      .then(data => {
        
        if (data.error) {
          document.getElementById('title').textContent = 'Erro ao carregar';
        } else {
          document.getElementById('title').textContent = data.title;
          document.getElementById('image').src = data.img_url;
          document.getElementById('description').textContent = data.descricao;
          document.getElementById('like').onclick = function() {
            likeArt(data.id);
          
        };
        const idArte = data.id;  
        }
      })
      .catch(err => {
        console.error('Erro de conexão:', err);
        document.getElementById('title').textContent = 'Erro ao conectar';
      });

      async function likeArt(idArte) {
      const idUsuario = sessionStorage.ID_USUARIO;
      
      await fetch('/arte/salvara', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idUsuario: Number(idUsuario), idArte: Number(idArte)  })
      });
      alert('Adicionado à sua favorita!');
    }
</script>
