<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../assets/LOGO.png" />
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazart | Música</title>

    
    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!--FONT AWESOME-->
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
</head>
<body onload="loadPlaylist(); loadChart()">
    <div class="janela">
            
        <div class="header-left">
            <h1 class="titulo">Bazart</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="dashboard.html">
                    <h3>Arte do dia</h3>
                </a>
                

            </div>
            
            <div class="btn-nav">
                
                    <h3>Músicas e tradições</h3>
                
            </div>

            <div class="btn-nav-white">
                <a href="./mural.html">
                    <h3>Meus favoritos</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        
        
        </div >

            
        <div class="main">
            <div class="musicas">
                <div class="music-playlist">
                    <h2>Playlist Persa</h2>
                    <div id="playlist-container"></div>
                    <audio id="audioPlayer" controls></audio>
                </div>  
                <div class="chart">
                    <h2>Músicas Mais Curtidas 🎵</h2>
                    <canvas id="mostLikedChart"></canvas>
                </div>
            </div>
        </div>
           
        
        
    </div>
</body>
</html>
<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    function playSong(path) {
      const player = document.getElementById('audioPlayer');
      
      player.src = path;
      player.play();
    }
    async function likeSong(event, idMusica) {
      const idUsuario = sessionStorage.ID_USUARIO;
      await fetch('/musica/salvar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idUsuario: Number(idUsuario), idMusica: Number(idMusica)  })
      });
      const likeBtn = event.target;
      likeBtn.textContent = '💖';
      likeBtn.disabled = true;
      likeBtn.style.opacity = 0.6;
    }

    async function loadPlaylist() {
        try {
            const idUsuario = sessionStorage.ID_USUARIO;
            const response = await fetch('/musica/mostrar');
            const musicas = await response.json();

            const likedRes = await fetch(`/musica/salvar-usuario?idUsuario=${idUsuario}`);
            const likedIds = await likedRes.json();

            const container = document.getElementById('playlist-container');
            container.innerHTML = '';

            musicas.forEach(musica => {
                const isLiked = likedIds.includes(musica.id);
                const songDiv = document.createElement('div');
                songDiv.innerHTML = `
                <p>${musica.title} - ${musica.artist}</p>
                <button onclick="playSong('${musica.music_url}')">▶️</button>
                <button onclick="likeSong(event, ${musica.id})"${isLiked ? "disabled style='opacity:0.6'" : ""}
                >${isLiked ? "💖" : "❤️"}</button>
                `;
                container.appendChild(songDiv);
            });
        } catch (err) {
            console.error('Erro ao carregar músicas:', err);
        }
    }

    async function loadChart() {
    try {
        const res = await fetch('/musica/curtidas');
        const data = await res.json();

        const labels = data.map(item => item.title);
        const likes = data.map(item => item.likes);

        const ctx = document.getElementById('mostLikedChart').getContext('2d');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Curtidas',
                    data: likes,
                    backgroundColor: '#FCA311',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: {
                        display: true,
                        text: 'Top 5 Músicas Mais Curtidas'
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        }
                    }
                }
            }
        });
    } catch (error) {
        console.error('Erro ao carregar gráfico:', error);
    }
}

    window.onload = function(){loadPlaylist(); loadChart();};

</script>
