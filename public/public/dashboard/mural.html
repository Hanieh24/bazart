<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaTech | Avisos</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="loadFavorites();">

    <div class="janela">


        <div class="header-left">

            <h1>AquaTech</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="cards.html">
                    <h3>Aquários</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Gráficos</h3>
                </a>
            </div>

            <div class="btn-nav">
                <h3>Mural de Avisos</h3>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <h2>🎵 Suas Músicas Curtidas</h2>
        <div id="fav-songs"></div>

        <h2>🖼️ Suas Artes Favoritas</h2>
        <div id="fav-art"></div>

</body>

</html>

<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    async function loadFavorites() {
      // Fetch favorite songs
        const idUsuario = sessionStorage.ID_USUARIO;
      const songsRes = await fetch(`/main/playlist?idUsuario=${idUsuario}`);
      const songs = await songsRes.json();
      const songContainer = document.getElementById('fav-songs');
      songContainer.innerHTML = songs.map(song => `
        <div>
          <strong>${song.title}</strong> - ${song.artist}
          <audio controls src="${song.music_url}"></audio>
        </div>
      `).join('');

      // Fetch favorite art
      const artRes = await fetch(`/main/list?idUsuario=${idUsuario}`);
      const art = await artRes.json();
      const artContainer = document.getElementById('fav-art');
      artContainer.innerHTML = art.map(a => `
        <div>
          <p><strong>${a.title}</strong></p>
          <img src="${a.img_url}" alt="${a.title}" width="200" />
          
          <p>${a.descricao}</p>
        </div>
      `).join('');
    }


</script>
