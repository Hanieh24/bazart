<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="icon" type="image/png" href="./assets/LOGO.png" />
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazart | Favoritos</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="loadFavorites();">

    <div class="janela">
        <div class="header-left">
            <h1 class="titulo">Bazart</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
              <a href="dashboard.html">
                <h3>Arte do dia</h3>
              </a>  
            </div>
            
            <div class="btn-nav-white">
                <a href="./musicas.html">
                    <h3>Músicas e tradições</h3>
                </a>
            </div>

            <div class="btn-nav">
                
                    <h3>Meus favoritos</h3>
                
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>
        
          
        </div>
        <div class="lista">
          <div>
            <h2>🎵 Suas Músicas Curtidas</h2>
            <div id="fav-songs"></div>
          </div>
          <div>
            <h2>🖼️ Suas Artes Favoritas</h2>
            <div id="fav-art"></div>
          </div>  
        </div>
  </div>
        

</body>

</html>

<script>

    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    async function loadFavoriteSongs() {
    const idUsuario = sessionStorage.ID_USUARIO;
    const songContainer = document.getElementById('fav-songs');
    try {
        const songsRes = await fetch(`/main/playlist?idUsuario=${idUsuario}`);
        if (!songsRes.ok) throw new Error("Erro ao buscar músicas");
        const songs = await songsRes.json();
        if (!Array.isArray(songs) || songs.length === 0) {
            songContainer.innerHTML = "<p>Nenhuma música curtida.</p>";
        } else {
            songContainer.innerHTML = songs.map(song => `
                <div>
                  <strong>${song.title}</strong> - ${song.artist}
                  <audio controls src="${song.music_url}"></audio>
                </div>
            `).join('');
        }
    } catch (err) {
        songContainer.innerHTML = "<p>Erro ao carregar músicas favoritas.</p>";
    }
}

async function loadFavoriteArt() {
    const idUsuario = sessionStorage.ID_USUARIO;
    const artContainer = document.getElementById('fav-art');
    try {
        const artRes = await fetch(`/main/list?idUsuario=${idUsuario}`);
        if (!artRes.ok) throw new Error("Erro ao buscar artes");
        const art = await artRes.json();
        if (!Array.isArray(art) || art.length === 0) {
            artContainer.innerHTML = "<p>Nenhuma arte favorita.</p>";
        } else {
            artContainer.innerHTML = art.map(a => `
                <div>
                  <p><strong>${a.title}</strong></p>
                  <img src="${a.img_url}" alt="${a.title}" width="200" />
                  <p>${a.descricao}</p>
                </div>
            `).join('');
        }
    } catch (err) {
        artContainer.innerHTML = "<p>Erro ao carregar artes favoritas.</p>";
    }
}

window.onload = function() {
    loadFavoriteSongs();
    loadFavoriteArt();
};


</script>
